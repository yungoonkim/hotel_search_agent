services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - hotel_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotel -d hotel']
      interval: 3s
      retries: 15
volumes:
  hotel_data:
